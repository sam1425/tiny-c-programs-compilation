# --- SUCKLESS BASIC STYLE ---
input_tab_size           = 8
output_tab_size          = 8
indent_columns           = 8
indent_with_tabs         = 2        # 1=indent to level, 2=indent with tabs
code_width               = 0        # Don't wrap long lines

# --- VERTICAL ALIGNMENT ---
align_keep_tabs          = true
align_on_tabstop         = true

# Align variable names across multiple lines
align_var_def_span       = 5
align_var_def_inline     = true
align_var_def_star_style = 2

# Align the '=' signs
align_assign_span        = 5
align_assign_thresh      = 12

# Align trailing comments
align_right_cmt_span     = 5

# --- ARRAY & STRUCT ALIGNMENT (The Table Maker) ---
align_struct_init_span   = 3        # This aligns columns in rules[]
align_typedef_span       = 3

# --- SPACING & BRACES ---
nl_if_brace              = remove 
sp_before_sparen         = remove   # Suckless style: if(x) not if (x)
sp_func_call_paren       = remove   # No space: func() not func ()
sp_after_type            = force
sp_after_cast            = force

eat_blanks_after_open_brace  = true
eat_blanks_before_close_brace = true

nl_fdef_brace            = remove   # Braces on same line as func def
nl_after_return          = false
