
# Basic indentation
indent_columns        = 4
indent_with_tabs      = 0
indent_switch_case    = 4

# Newlines
nl_after_brace_open   = true
nl_after_brace_close  = true
nl_after_return       = true

# Braces (Allman style – easy to read)
nl_fdef_brace         = add
nl_if_brace           = add
nl_for_brace          = add
nl_while_brace        = add
nl_switch_brace       = add

# Spaces
sp_arith              = add
sp_assign             = add
sp_compare            = add
sp_bool               = add
sp_after_comma        = add
sp_inside_paren       = remove

# Keep simple one-liners expanded
nl_if_leave_one_liners = false
nl_for_leave_one_liners = false
nl_while_leave_one_liners = false

# Alignment
align_var_def_span    = 1
align_enum_equ_span   = 1
align_assign_span     = 1

# Line endings
newlines              = lf
